services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pokemondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pokemondb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ..
    environment:
      SPRING_PROFILES_ACTIVE: qa
      DB_URL: jdbc:postgresql://db:5432/pokemondb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
