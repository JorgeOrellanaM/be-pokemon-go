# QA profile, used by the Docker image (SPRING_PROFILES_ACTIVE=qa).
# Only overrides what differs from application.properties; seed data (data.sql) is still loaded.

# Default host "db" is the Postgres service in docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/pokemondb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=false
logging.level.com.interview.pokemon_go=INFO

management.endpoints.web.exposure.include=health
