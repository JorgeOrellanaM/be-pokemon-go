# Local development profile: ./gradlew bootRun --args='--spring.profiles.active=dev'
# Only overrides what differs from application.properties.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokemondb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=true
logging.level.com.interview.pokemon_go=DEBUG

management.endpoints.web.exposure.include=health,info
