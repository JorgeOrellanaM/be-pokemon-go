spring.application.name=pokemon-go

spring.datasource.url=jdbc:postgresql://localhost:5432/pokemondb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Seed data (data.sql) runs after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# PokeAPI client (US02 details)
pokeapi.base-url=https://pokeapi.co/api/v2
pokeapi.connect-timeout=3s
pokeapi.read-timeout=5s

# Error bodies are built by GlobalExceptionHandler / ApiErrorController; never expose internals
spring.mvc.problemdetails.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Reject unknown JSON fields: with PUT semantics a misspelled field would silently clear the real one
spring.jackson.deserialization.fail-on-unknown-properties=true
